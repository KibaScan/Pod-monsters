# Pod Monsters CI — drop this at:  .github/workflows/ci.yml
#
# Enforces merge gates 1 & 2 on every PR to main:
#   1. swift test (green)
#   2. swift build with complete strict-concurrency checking, warnings = errors
#
# Mark these as required status checks in branch protection (Settings → Branches).
# Note: enable `swift test` now (passes today); add `strict-concurrency` as required
# once it's green (see docs/WORKFLOW.md → Caveats).

name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  strict-concurrency:
    name: strict concurrency (warnings = errors)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with complete concurrency checking
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

